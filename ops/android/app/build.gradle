plugins { id 'com.android.application' }

android {
    namespace 'com.cactuspos.client'
    compileSdk 36
    defaultConfig {
        applicationId 'com.cactuspos.client'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('CACTUS_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('CACTUS_ANDROID_KEYSTORE'))
                storePassword System.getenv('CACTUS_ANDROID_STORE_PASSWORD')
                keyAlias 'cactuspos'
                keyPassword System.getenv('CACTUS_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
